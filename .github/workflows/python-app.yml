name: Python application
on:
  repository_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - name: Set up Python
        uses: actions/setup-python@main
      - name: Install dependencies
        run: |
          python.exe -m pip install --upgrade pip
          pip.exe install flake8 pytest
      - name: Lint with flake8
        run: |
          flake8.exe . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8.exe . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        env:
          PYTEST: ${{ secrets.PYTEST }}
        run: |
          Invoke-Expression -Command "$env:PYTEST" *> "pytest.txt"
